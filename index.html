<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دعوة زفاف</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a090d;
      color: #fff;
      text-align: center;
    }
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #5c1626 0%, #1a090d 100%);
    }
    h1 {
      font-size: 2.5rem;
      color: #f3ce90;
      margin-bottom: 10px;
    }
    p { font-size: 1.2rem; }
    .btn-open {
      margin-top: 20px;
      padding: 12px 30px;
      background-color: #f3ce90;
      color: #1a090d;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .btn-open:hover { transform: scale(1.05); }
    .details {
      padding: 50px 20px;
      display: none; /* تظهر عند الضغط */
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #f3ce90;
      padding: 20px;
      border-radius: 15px;
      margin: 20px auto;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <div class="hero" id="hero">
    <p>دعوة زفاف</p>
    <h1>مصطفى & مريم</h1>
    <button class="btn-open" onclick="openInvitation()">💍 المس لفتح الدعوة</button>
  </div>

  <div class="details" id="details">
    <div class="card">
      <h2>يسرنا حضوركم حفل زفافنا</h2>
      <p>📅 اليوم: الجمعة</p>
      <p>⏰ الساعة: 7:00 مساءً</p>
      <p>📍 المكان: قاعة الأفراح</p>
    </div>
    
    <a href="https://maps.google.com" target="_blank">
      <button class="btn-open">📍 موقع القاعة على الخريطة</button>
    </a>
  </div>

  <script>
    function openInvitation() {
      document.getElementById('details').style.display = 'block';
      window.scrollTo({
        top: window.innerHeight,
        behavior: 'smooth'
      });
    }
  </script>
</body>
</html>
